title: WMI Lateral Movement Execution
id: 9d59b09e-d3d9-44b5-a4d6-08f1b59a4cef
status: stable
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\WmiPrvSE.exe'
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\wscript.exe'
      - '\cscript.exe'
  condition: selection
falsepositives:
  - Legitimate WMI-based management tools
level: high
tags:
  - attack.lateral_movement
  - attack.t1021.006
  - attack.execution
  - attack.t1047
mitre:
  technique: T1047
  tactic: Execution
